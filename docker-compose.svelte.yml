services:
  postgres:
    image: postgres:18-alpine
    container_name: ai-casino-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=ai_casino
      - POSTGRES_USER=ai_casino
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ${HOME}/.ai-casino/postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - ai-casino-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_casino"]
      interval: 5s
      timeout: 3s
      retries: 5

  daemon:
    build: .
    container_name: ai-casino-daemon
    restart: unless-stopped
    volumes:
      - ${HOME}/.ai-casino:/root/.ai-casino
    environment:
      - LOG_LEVEL=INFO
    ports:
      - "8484:8484"
    networks:
      - ai-casino-net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8484/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-casino-frontend
    restart: unless-stopped
    ports:
      - "8050:80"
    depends_on:
      daemon:
        condition: service_healthy
    networks:
      - ai-casino-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 5s
      timeout: 3s
      retries: 5

networks:
  ai-casino-net:
    driver: bridge
