# Development overrides for docker-compose.yml (with Ollama)
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev-ollama.yml up
#
# After first start, pull qwen3:14b model (~8GB):
#   docker exec ai-casino-ollama-dev ollama pull qwen3:14b
#
# Requires: ~/.ai-casino/daemon-dev.yaml with Ollama config

services:
  ollama:
    image: ollama/ollama:0.17.1
    container_name: ai-casino-ollama-dev
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      # Persist models on host (qwen3:14b is ~8GB)
      - ${HOME}/.ai-casino/ollama-models:/root/.ollama
    networks:
      - ai-casino-net
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Uncomment for GPU support (NVIDIA):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  daemon:
    # Mount source code for live reload (restart daemon after code changes)
    volumes:
      - ./src:/app/src:ro
      - ./pyproject.toml:/app/pyproject.toml:ro
      - ${HOME}/.ai-casino/daemon-dev.yaml:/root/.ai-casino/daemon-production.yaml:ro  # Ollama dev config
    environment:
      - LOG_LEVEL=DEBUG
    depends_on:
      postgres:
        condition: service_healthy
      finbert:
        condition: service_healthy
      ollama:
        condition: service_healthy

  finbert:
    environment:
      - FINBERT_LOG_LEVEL=DEBUG

  frontend:
    # Use Vite dev server with HMR instead of nginx
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./frontend/src:/app/src:ro
      - ./frontend/static:/app/static:ro
      - ./frontend/.svelte-kit:/app/.svelte-kit
      - ./frontend/package.json:/app/package.json:ro
      - ./frontend/package-lock.json:/app/package-lock.json:ro
      - ./frontend/svelte.config.js:/app/svelte.config.js:ro
      - ./frontend/vite.config.ts:/app/vite.config.ts:ro
      - ./frontend/tsconfig.json:/app/tsconfig.json:ro
    # Override base ports: dev uses Vite (5173) instead of nginx (8050:80)
    # Compose merges lists, but different target ports prevent conflicts
    ports:
      - "5173:5173"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5173"]
      interval: 5s
      timeout: 3s
      retries: 5
