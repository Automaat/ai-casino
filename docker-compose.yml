services:
  postgres:
    image: postgres:18-alpine
    container_name: ai-casino-postgres
    restart: unless-stopped
    environment:
      # Database configuration
      # IMPORTANT: Set POSTGRES_PASSWORD env var in production (or pass via .env file)
      # The daemon's DATABASE_URL password must match this postgres container password
      - POSTGRES_DB=ai_casino
      - POSTGRES_USER=ai_casino
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-CHANGE_ME_INSECURE_DEFAULT}
    volumes:
      # Persistent storage on host machine (PostgreSQL 18+ requires mount at /var/lib/postgresql)
      - ${HOME}/.ai-casino/postgres-data:/var/lib/postgresql
    ports:
      - "5432:5432"
    networks:
      - ai-casino-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_casino"]
      interval: 5s
      timeout: 3s
      retries: 5

  finbert:
    build:
      context: ./services/finbert
      dockerfile: Dockerfile
    container_name: ai-casino-finbert
    restart: unless-stopped
    environment:
      - FINBERT_DEVICE=cpu
      - FINBERT_LOG_LEVEL=INFO
    ports:
      - "8485:8485"
    networks:
      - ai-casino-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8485/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s
    # Uncomment for GPU support:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  daemon:
    build: .
    container_name: ai-casino-daemon
    restart: unless-stopped
    volumes:
      # Mount production config from host
      # Configure FinBERT mode in ~/.ai-casino/daemon.yaml (see docs/daemon.yaml.example)
      - ${HOME}/.ai-casino:/root/.ai-casino
    environment:
      # Log level (can override in config)
      - LOG_LEVEL=INFO
    ports:
      # Expose API
      - "8484:8484"
    networks:
      - ai-casino-net
    depends_on:
      postgres:
        condition: service_healthy
      finbert:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8484/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-casino-frontend
    restart: unless-stopped
    ports:
      - "8050:80"
    networks:
      - ai-casino-net
    depends_on:
      daemon:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80"]
      interval: 5s
      timeout: 3s
      retries: 5

networks:
  ai-casino-net:
    driver: bridge
