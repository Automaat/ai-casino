services:
  daemon:
    build: .
    container_name: ai-casino-daemon
    restart: unless-stopped
    volumes:
      # Mount production config from host
      - ${HOME}/.ai-casino:/root/.ai-casino
    environment:
      # LLM provider (config takes priority, these are fallbacks)
      - LLM_PROVIDER=openai
      - LLM_MODEL=gpt-5-nano
      # Log level
      - LOG_LEVEL=INFO
    ports:
      # Expose API for dashboard
      - "8484:8484"
    networks:
      - ai-casino-net

  dashboard:
    build: .
    container_name: ai-casino-dashboard
    restart: unless-stopped
    command: ["uv", "run", "python", "-m", "src.main", "dashboard", "--api-url", "http://daemon:8484", "--port", "8050"]
    environment:
      - DASHBOARD_HOST=0.0.0.0
    ports:
      - "8050:8050"
    depends_on:
      - daemon
    networks:
      - ai-casino-net

networks:
  ai-casino-net:
    driver: bridge
