services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-casino-postgres
    restart: unless-stopped
    environment:
      # Database configuration (POSTGRES_PASSWORD must be provided via environment or .env)
      - POSTGRES_DB=ai_casino
      - POSTGRES_USER=ai_casino
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-ai_casino_secure_pass_2025}
    volumes:
      # Persistent storage on host machine (survives container restarts)
      - ${HOME}/.ai-casino/postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - ai-casino-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_casino"]
      interval: 5s
      timeout: 3s
      retries: 5

  daemon:
    build: .
    container_name: ai-casino-daemon
    restart: unless-stopped
    volumes:
      # Mount production config from host
      - ${HOME}/.ai-casino:/root/.ai-casino
    environment:
      # Log level (can override in config)
      - LOG_LEVEL=INFO
    ports:
      # Expose API for dashboard
      - "8484:8484"
    networks:
      - ai-casino-net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8484/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  dashboard:
    build: .
    container_name: ai-casino-dashboard
    restart: unless-stopped
    command: ["uv", "run", "python", "-m", "src.main", "dashboard", "--api-url", "http://daemon:8484", "--port", "8050"]
    environment:
      - DASHBOARD_HOST=0.0.0.0
    ports:
      - "8050:8050"
    depends_on:
      daemon:
        condition: service_healthy
    networks:
      - ai-casino-net

networks:
  ai-casino-net:
    driver: bridge
