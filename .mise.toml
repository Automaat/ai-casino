[tools]
python = "3.14.3"
"pipx:uv" = "0.10.2"
"pipx:ruff" = "0.15.0"
ollama = "0.13.5"

[tasks.lint]
description = "Run ruff linter"
run = "ruff check src tests"

[tasks.format]
description = "Format code with ruff"
run = "ruff format src tests"

[tasks."format:check"]
description = "Check code formatting"
run = "ruff format --check src tests"

[tasks.typecheck]
description = "Run type checker"
run = "uv run --all-extras pyrefly check"

[tasks.test]
description = "Run pytest"
run = "uv run --all-extras pytest -v"

[tasks."test:cov"]
description = "Run pytest with coverage"
run = "uv run --all-extras pytest --cov=src --cov-report=term-missing"

[tasks.check]
description = "Run all checks (format, lint, typecheck, test)"
depends = ["format:check", "lint", "typecheck", "test"]

[tasks.audit]
description = "Run pip-audit to check for CVEs"
run = "uv run --all-extras pip-audit --ignore-vuln CVE-2025-69872"

[tasks."ollama:start"]
description = "Start Ollama server in background"
run = "ollama serve > /dev/null 2>&1 &"

[tasks."ollama:stop"]
description = "Stop Ollama server"
run = "pkill -f 'ollama serve' || true"

[tasks."ollama:status"]
description = "Check if Ollama is running"
run = "pgrep -f 'ollama serve' && echo 'Ollama is running' || echo 'Ollama is not running'"

[tasks.dev]
description = "Run daemon with Dash dashboard (legacy, API enabled)"
run = """
  trap 'pkill -P $$' EXIT
  uv run python -m src.main daemon --config daemon-dev.yaml &
  DAEMON_PID=$!
  echo "Daemon started (PID: $DAEMON_PID)"
  sleep 3
  echo "Starting dashboard at http://localhost:8050"
  uv run python -m src.main dashboard --api-url http://127.0.0.1:8484
"""
env = { LLM_PROVIDER = "ollama", LLM_MODEL = "qwen3:14b" }

[tasks."dev:momentum"]
description = "Run analysis with momentum strategy only (no meta-agent)"
usage = 'arg "<symbol>" help="Stock ticker" default="AAPL"'
run = "uv run python -m src.main analyze ${usage_symbol?} --no-meta-agent"
env = { LLM_PROVIDER = "ollama", LLM_MODEL = "qwen3:14b" }

[tasks.daemon]
description = "Run autonomous trading daemon"
run = "uv run python -m src.main daemon"
env = { LLM_PROVIDER = "ollama", LLM_MODEL = "qwen3:14b" }

[tasks.chat]
description = "Launch interactive TUI chat"
run = "uv run python -m src.main chat"
env = { LLM_PROVIDER = "ollama", LLM_MODEL = "qwen3:14b" }

[tasks.dashboard]
description = "Launch Dash dashboard"
usage = 'option "--api-url" help="Daemon API URL" option "-p --port" help="Port" default="8050"'
run = "uv run python -m src.main dashboard ${usage_api_url:+--api-url \"$usage_api_url\"} ${usage_port:+--port $usage_port}"

[tasks."db:start"]
description = "Start PostgreSQL container"
run = "docker run -d --name ai-casino-db -p 5432:5432 -e POSTGRES_DB=ai_casino -e POSTGRES_HOST_AUTH_METHOD=trust postgres:17-alpine || docker start ai-casino-db"

[tasks."db:stop"]
description = "Stop PostgreSQL container"
run = "docker stop ai-casino-db || true"

[tasks."db:status"]
description = "Check if PostgreSQL is running"
run = "docker ps --filter name=ai-casino-db --format '{{.Status}}' | grep -q Up && echo 'PostgreSQL is running' || echo 'PostgreSQL is not running'"

[tasks."db:shell"]
description = "Open psql shell"
run = "docker exec -it ai-casino-db psql -U postgres -d ai_casino"

[tasks.prod]
description = "Run production daemon with Docker Compose (Dash UI)"
run = "docker compose up --build"

[tasks."prod:down"]
description = "Stop production daemon"
run = "docker compose down"

[tasks."prod:logs"]
description = "View production daemon logs"
run = "docker compose logs -f"

[tasks."prod:restart"]
description = "Restart production daemon"
run = "docker compose restart"

[tasks."prod:svelte"]
description = "Run production daemon with Svelte frontend (Docker Compose, uses ~/.ai-casino/daemon-production.yaml)"
run = "docker compose -f docker-compose.svelte.yml up --build"

[tasks."prod:svelte:down"]
description = "Stop Svelte production stack"
run = "docker compose -f docker-compose.svelte.yml down"

[tasks."prod:svelte:logs"]
description = "View Svelte production logs"
run = "docker compose -f docker-compose.svelte.yml logs -f"

[tasks."prod:svelte:restart"]
description = "Restart Svelte production stack"
run = "docker compose -f docker-compose.svelte.yml restart"

[tasks."prod:svelte:local"]
description = "Run daemon with Svelte frontend (local, dev config + prod build)"
run = """
  trap 'pkill -P $$' EXIT
  echo "Starting daemon with dev config..."
  uv run python -m src.main daemon --config daemon-dev.yaml &
  DAEMON_PID=$!
  echo "Daemon started (PID: $DAEMON_PID)"
  sleep 3
  echo "Installing frontend dependencies..."
  cd frontend && npm ci
  echo "Building Svelte frontend..."
  npm run build
  echo "Starting Svelte frontend at http://localhost:4173"
  npm run preview -- --host 0.0.0.0
"""
env = { NODE_ENV = "production" }

[tasks."dev:svelte"]
description = "Run daemon with Svelte frontend (dev mode)"
run = """
  trap 'pkill -P $$' EXIT
  echo "Starting daemon with dev config..."
  uv run python -m src.main daemon --config daemon-dev.yaml &
  DAEMON_PID=$!
  echo "Daemon started (PID: $DAEMON_PID)"
  sleep 3
  echo "Installing frontend dependencies..."
  cd frontend && npm ci
  echo "Starting Svelte dev server at http://localhost:5173"
  npm run dev -- --host 0.0.0.0
"""
