[tools]
python = "3.14.3"
"pipx:uv" = "0.11.3"
"pipx:ruff" = "0.15.9"
"pipx:semgrep" = "1.157.0"
ollama = "0.13.5"

[tasks.lint]
description = "Run ruff linter"
run = "ruff check src tests"

[tasks.format]
description = "Format code with ruff"
run = "ruff format src tests"

[tasks."format:check"]
description = "Check code formatting"
run = "ruff format --check src tests"

[tasks.typecheck]
description = "Run type checker"
run = "uv run --all-extras pyrefly check"

[tasks.test]
description = "Run pytest"
run = "uv run --all-extras pytest -v"

[tasks."test:cov"]
description = "Run pytest with coverage"
run = "uv run --all-extras pytest --cov=src --cov-report=term-missing"

[tasks.semgrep]
description = "Run semgrep rules on v1 package"
run = "semgrep --config .semgrep/ src/v1 --error"

[tasks.check]
description = "Run all checks (format, lint, typecheck, test)"
depends = ["format:check", "lint", "typecheck", "test", "semgrep"]

[tasks.audit]
description = "Run pip-audit to check for CVEs"
# CVE-2025-69872: diskcache pickle vulnerability - mitigated via JSONDisk (see src/data/websearch.py)
run = "uv run --all-extras pip-audit --ignore-vuln CVE-2025-69872"

[tasks."ollama:start"]
description = "Start Ollama server in background"
run = "ollama serve > /dev/null 2>&1 &"

[tasks."ollama:stop"]
description = "Stop Ollama server"
run = "pkill -f 'ollama serve' || true"

[tasks."ollama:status"]
description = "Check if Ollama is running"
run = "pgrep -f 'ollama serve' && echo 'Ollama is running' || echo 'Ollama is not running'"

[tasks.dev]
description = "Run dev environment (cloud LLM, uses ~/.ai-casino/daemon-production.yaml)"
run = "docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build --remove-orphans"

[tasks."dev:ollama"]
description = "Run dev environment with Ollama (uses ~/.ai-casino/daemon-dev.yaml)"
run = "docker compose -f docker-compose.yml -f docker-compose.dev-ollama.yml up --build --remove-orphans"

[tasks."dev:down"]
description = "Stop dev environment"
run = "docker compose -f docker-compose.yml -f docker-compose.dev.yml down"

[tasks."dev:ollama:down"]
description = "Stop dev environment (Ollama)"
run = "docker compose -f docker-compose.yml -f docker-compose.dev-ollama.yml down"

[tasks."dev:logs"]
description = "View dev environment logs"
run = "docker compose -f docker-compose.yml -f docker-compose.dev.yml logs -f"

[tasks."dev:restart"]
description = "Restart dev daemon (after code changes)"
run = "docker compose -f docker-compose.yml -f docker-compose.dev.yml restart daemon"

[tasks."dev:local"]
description = "Run daemon locally with ollama (old dev mode)"
run = "uv run python -m src.main daemon --config daemon-dev.yaml"
env = { LLM_PROVIDER = "ollama", LLM_MODEL = "qwen3:14b" }

[tasks."dev:momentum"]
description = "Run analysis with momentum strategy only (no meta-agent)"
usage = 'arg "<symbol>" help="Stock ticker" default="AAPL"'
run = "uv run python -m src.main analyze ${usage_symbol?} --no-meta-agent"
env = { LLM_PROVIDER = "ollama", LLM_MODEL = "qwen3:14b" }

[tasks.daemon]
description = "Run autonomous trading daemon"
run = "uv run python -m src.main daemon"
env = { LLM_PROVIDER = "ollama", LLM_MODEL = "qwen3:14b" }

[tasks.chat]
description = "Launch interactive TUI chat"
run = "uv run python -m src.main chat"
env = { LLM_PROVIDER = "ollama", LLM_MODEL = "qwen3:14b" }

[tasks."db:start"]
description = "Start PostgreSQL container"
run = "docker run -d --name ai-casino-db -p 5432:5432 -e POSTGRES_DB=ai_casino -e POSTGRES_HOST_AUTH_METHOD=trust postgres:17-alpine || docker start ai-casino-db"

[tasks."db:stop"]
description = "Stop PostgreSQL container"
run = "docker stop ai-casino-db || true"

[tasks."db:status"]
description = "Check if PostgreSQL is running"
run = "docker ps --filter name=ai-casino-db --format '{{.Status}}' | grep -q Up && echo 'PostgreSQL is running' || echo 'PostgreSQL is not running'"

[tasks."db:shell"]
description = "Open psql shell"
run = "docker exec -it ai-casino-db psql -U postgres -d ai_casino"

[tasks.prod]
description = "Run production daemon with Docker Compose"
run = "docker compose up --build --remove-orphans"

[tasks."prod:down"]
description = "Stop production daemon"
run = "docker compose down"

[tasks."prod:logs"]
description = "View production daemon logs"
run = "docker compose logs -f"

[tasks."prod:restart"]
description = "Restart production daemon"
run = "docker compose restart"

[tasks."dev:svelte"]
description = "Run daemon with Svelte frontend (dev mode)"
run = """
  trap 'pkill -P $$' EXIT
  echo "Starting daemon with dev config..."
  uv run python -m src.main daemon --config daemon-dev.yaml &
  DAEMON_PID=$!
  echo "Daemon started (PID: $DAEMON_PID)"
  sleep 3
  echo "Installing frontend dependencies..."
  cd frontend && npm ci
  echo "Starting Svelte dev server at http://localhost:5173"
  npm run dev -- --host 0.0.0.0
"""

[tasks.profile]
description = "Profile daemon cycle (default: 5 stocks, no issues created)"
usage = 'option "--stocks" help="Comma-separated stock symbols" default="AAPL,TSLA,GOOGL,MSFT,NVDA" option "--max-concurrent" help="Max concurrent analyses" default="3" option "--config" help="Config file path"'
run = "uv run --all-extras python scripts/profile_daemon.py --no-issues ${usage_stocks:+--stocks \"$usage_stocks\"} ${usage_max_concurrent:+--max-concurrent $usage_max_concurrent} ${usage_config:+--config \"$usage_config\"}"

[tasks."profile:prod"]
description = "Profile daemon with production config"
run = "uv run --all-extras python scripts/profile_daemon.py --config ~/.ai-casino/daemon-production.yaml --no-issues"

[tasks."profile:report"]
description = "Open latest profiling report"
run = "cat $(ls -t ~/.ai-casino/profiles/benchmark/bottleneck_report_*.json | head -1)"

[tasks."profile:issues"]
description = "Profile and create GitHub issues for top 3 bottlenecks"
usage = 'option "--config" help="Config file path"'
run = "uv run --all-extras python scripts/profile_daemon.py ${usage_config:+--config \"$usage_config\"}"
