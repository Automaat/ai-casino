[tools]
python = "3.14.3"
"pipx:uv" = "0.9.29"
"pipx:ruff" = "0.15.0"
ollama = "0.13.5"

[tasks.lint]
description = "Run ruff linter"
run = "ruff check src tests"

[tasks.format]
description = "Format code with ruff"
run = "ruff format src tests"

[tasks."format:check"]
description = "Check code formatting"
run = "ruff format --check src tests"

[tasks.test]
description = "Run pytest"
run = "uv run pytest -v"

[tasks."test:cov"]
description = "Run pytest with coverage"
run = "uv run pytest --cov=src --cov-report=term-missing"

[tasks.check]
description = "Run all checks (format, lint, test)"
depends = ["format:check", "lint", "test"]

[tasks."ollama:start"]
description = "Start Ollama server in background"
run = "ollama serve > /dev/null 2>&1 &"

[tasks."ollama:stop"]
description = "Stop Ollama server"
run = "pkill -f 'ollama serve' || true"

[tasks."ollama:status"]
description = "Check if Ollama is running"
run = "pgrep -f 'ollama serve' && echo 'Ollama is running' || echo 'Ollama is not running'"

[tasks.dev]
description = "Run analysis with meta-agent (dynamic strategy selection)"
usage = 'arg "<symbol>" help="Stock ticker" default="AAPL"'
run = "uv run python -m src.main analyze ${usage_symbol?}"
env = { LLM_PROVIDER = "ollama", LLM_MODEL = "qwen3:14b" }

[tasks."dev:momentum"]
description = "Run analysis with momentum strategy only (no meta-agent)"
usage = 'arg "<symbol>" help="Stock ticker" default="AAPL"'
run = "uv run python -m src.main analyze ${usage_symbol?} --no-meta-agent"
env = { LLM_PROVIDER = "ollama", LLM_MODEL = "qwen3:14b" }

[tasks.daemon]
description = "Run autonomous trading daemon"
usage = 'option "-c --config" help="Config file path"'
run = "uv run python -m src.main daemon ${usage_config? --config $usage_config}"
env = { LLM_PROVIDER = "ollama", LLM_MODEL = "qwen3:14b" }

[tasks.chat]
description = "Launch interactive TUI chat"
run = "uv run python -m src.main chat"
env = { LLM_PROVIDER = "ollama", LLM_MODEL = "qwen3:14b" }

[tasks."db:start"]
description = "Start PostgreSQL container"
run = "docker run -d --name ai-casino-db -p 5432:5432 -e POSTGRES_DB=ai_casino -e POSTGRES_HOST_AUTH_METHOD=trust postgres:17-alpine || docker start ai-casino-db"

[tasks."db:stop"]
description = "Stop PostgreSQL container"
run = "docker stop ai-casino-db || true"

[tasks."db:status"]
description = "Check if PostgreSQL is running"
run = "docker ps --filter name=ai-casino-db --format '{{.Status}}' | grep -q Up && echo 'PostgreSQL is running' || echo 'PostgreSQL is not running'"

[tasks."db:shell"]
description = "Open psql shell"
run = "docker exec -it ai-casino-db psql -U postgres -d ai_casino"
