# Development daemon configuration with API enabled
daemon:
  watchlist: ["AAPL", "TSLA", "GOOGL", "MSFT"]
  interval_minutes: 30
  market_hours_only: true
  auto_trade: false
  max_concurrent_analyses: 3

  api:
    enabled: true
    host: "0.0.0.0"
    port: 8484
    cors_origins: ["http://localhost:8050", "http://localhost:5173", "http://localhost:4173"]

  # Database configuration for dev (connects to postgres container)
  database:
    database_url: "postgresql+asyncpg://ai_casino:ai_casino_secure_pass_2025@postgres:5432/ai_casino"
    enable_persistence: true
    pool_size: 5
    max_overflow: 10

  # LLM Configuration (dev uses Ollama for free local inference)
  llm:
    provider: "ollama"
    model: "qwen3:14b"
    ollama_base_url: "http://ollama:11434"  # Container hostname for docker-compose
    max_concurrent: 5
