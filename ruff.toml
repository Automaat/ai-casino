# Ruff strict configuration
line-length = 110
target-version = "py314"

[lint]
# Strict typing philosophy:
# - All functions must have complete type annotations (ANN)
# - Any type is banned except as last resort (ANN401)
# - Prefer typed classes (Pydantic/dataclass) over dicts/kwargs with Any
# - No implicit Optional (RUF013)
select = [
    "F",      # Pyflakes
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "C90",    # mccabe complexity
    "I",      # isort
    "N",      # pep8-naming
    "D",      # pydocstyle
    "UP",     # pyupgrade
    "ANN",    # flake8-annotations (includes ANN401 - ban Any)
    "S",      # flake8-bandit
    "BLE",    # flake8-blind-except
    "FBT",    # flake8-boolean-trap
    "FURB",   # refurb (modernization)
    "B",      # flake8-bugbear
    "A",      # flake8-builtins
    "COM",    # flake8-commas
    "C4",     # flake8-comprehensions
    "DTZ",    # flake8-datetimez
    "T10",    # flake8-debugger
    "EM",     # flake8-errmsg
    "ISC",    # flake8-implicit-str-concat
    "ICN",    # flake8-import-conventions
    "G",      # flake8-logging-format
    "PIE",    # flake8-pie
    "T20",    # flake8-print
    "PT",     # flake8-pytest-style
    "Q",      # flake8-quotes
    "RSE",    # flake8-raise
    "RET",    # flake8-return
    "SLF",    # flake8-self
    "SIM",    # flake8-simplify
    "TID",    # flake8-tidy-imports
    "TCH",    # flake8-type-checking
    "ARG",    # flake8-unused-arguments
    "ASYNC",  # flake8-async (blocking calls in async)
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate
    "PL",     # Pylint
    "TRY",    # tryceratops
    "RUF",    # Ruff-specific rules
]

ignore = [
    "D203",    # one-blank-line-before-class (conflicts with D211)
    "D213",    # multi-line-summary-second-line (conflicts with D212)
    "S311",    # suspicious-non-cryptographic-random-usage (OK for trading randomness)
    "FBT001",  # boolean-positional-arg (OK for simple flags)
    "FBT002",  # boolean-default-arg (OK for simple flags)
    "COM812",  # trailing-comma-missing (conflicts with formatter)
    "D104",    # missing-docstring-in-public-package (OK for __init__.py)
    "TRY300",  # else-block style preference
    "PLC0415", # import location OK in tests
    "SIM117",  # nested with statements OK for clarity
    "BLE001",  # catch Exception OK in main CLI
    "TC001",   # keep application imports at top level for clarity
    "TC002",   # keep third-party imports at top level (Pydantic needs runtime types)
    "TC003",   # keep typing imports at top level (no TYPE_CHECKING blocks)
    "UP046",   # use type params for Generic (py312+ breaking change, defer migration)
    "UP047",   # use type params for functions (py312+ breaking change, defer migration)
]

[lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",    # assert allowed in tests
    "S105",    # hardcoded password false positives in test fixtures
    "S106",    # hardcoded password false positives in test arguments
    "ANN",     # type annotations not required in tests
    "D",       # docstrings not required in tests
    "PLR2004", # magic values OK in tests
    "PLR0913", # many args OK for pytest fixtures
    "SLF001",  # private member access OK for testing
    "ARG001",  # unused args OK in fixtures
    "DTZ",     # timezone not critical in test data
    "ASYNC110", # allow while+sleep in test mocks simulating watchers
    "TRY003",  # allow long exception messages in tests
    "EM101",   # allow string literals in exceptions in tests
    "F841",    # allow unused variables in tests (e.g., mock_logger for patching)
]
"src/agents/*.py" = [
    "PLR2004", # magic values OK in thresholds/heuristics
    "PLR0913", # many args OK for detailed agent configs
    "E501",    # line length OK in formatted strings
]
"src/strategies/*.py" = [
    "PLR0913", # many args OK for strategy configs
]
"src/data/*.py" = [
    "PLR2004", # magic values OK in data processing limits
    "PLR0913", # many args OK for fetcher constructors with cache injection
    "DTZ005",  # timezone not critical for data timestamps
    "TRY300",  # else-block style OK
    "TRY301",  # raise in try OK for data validation
]
"src/workflows/stages/*.py" = [
    "PLR0913", # many args OK for pipeline stage orchestration
    "SLF001",  # private member access OK for tightly-coupled workflow components
    "ANN401",  # Any required for workflow parameter (circular import)
]
"scripts/*.py" = [
    "SLF001",  # private member access OK in profiling/benchmarking scripts
    "T201",    # print OK in scripts
    "ANN",     # type annotations not required in scripts
    "S101",    # assert OK in scripts
]
"src/main.py" = [
    "T201",    # print OK in CLI
    "PLR2004", # magic values OK for CLI args
    "E501",    # line length OK in formatted strings
]
"src/cli/*.py" = [
    "PLR0913", # many args OK for typer CLI commands
    "TRY301",  # raise in try OK for CLI error handling (typer.Exit)
]
"src/daemon/*.py" = [
    "PLR2004", # magic values OK for time calculations and limits
    "TRY301",  # raise in try OK for runtime guards
    "C901",    # complexity OK for orchestration logic
    "PLR0912", # many branches OK for state machine
]
"src/daemon/event_watcher.py" = [
    "PLR0913", # many args OK for comprehensive watcher config
]
"src/discovery/engine.py" = [
    "C901",    # complexity OK for multi-source discovery orchestration
    "PLR0912", # many branches OK for source evaluation
    "PLR0915", # many statements OK for discovery pipeline
]
"src/daemon/api/**/*.py" = [
    "B008",    # Depends() in argument defaults is standard FastAPI pattern
]
"src/tui/*.py" = [
    "PLR2004", # magic values OK for time calculations
    "RUF012", # textual uses class attributes for BINDINGS
    "S105",   # false positive on event type names
]
"src/tui/worker.py" = [
    "S603",   # subprocess with validated input for worker isolation
]
"src/tui/widgets/*.py" = [
    "PLR2004", # magic values OK for time calculations
]
"src/execution_tracking/decorators.py" = [
    "ANN401", # Any required for generic decorator wrappers
    "RET504", # explicit return for clarity in tracking context
]
"src/execution_tracking/models.py" = [
    "ANN401", # Any required for dynamic node updates
]
"src/execution_tracking/tracker.py" = [
    "F841",   # loop variable intentionally captured for scope
    "RUF006", # fire-and-forget task publishing (event bus handles lifecycle)
]
"src/daemon/tasks/*.py" = [
    "ARG002", # unused method args OK in abstract method implementations
    "C901",   # complexity OK for orchestration tasks
    "PLR0915", # many statements OK for multi-step task execution
]
"src/daemon/context_builder.py" = [
    "ARG002", # unused args OK in stub implementations awaiting feature completion
]
"src/daemon/state/managers/discovery.py" = [
    "ARG002", # unused args OK for future pagination support
]
"src/daemon/task_service.py" = [
    "ARG002", # unused args OK in methods awaiting async state migration
]
"src/tui/commands.py" = [
    "ARG002", # unused args OK in command handlers with reserved parameters
]
"src/database/types.py" = [
    "ANN401", # Any required for SQLAlchemy TypeDecorator interface (dynamic type system)
    "ARG002", # unused method args OK in TypeDecorator interface implementation
]

[lint.mccabe]
max-complexity = 10

[lint.pydocstyle]
convention = "google"

[lint.flake8-annotations]
# Strict typing enforcement
allow-star-arg-any = false  # Ban Any even in *args, **kwargs
suppress-dummy-args = true  # Allow omitting types for dummy args like _ or __

[format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
