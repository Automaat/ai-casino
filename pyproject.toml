[project]
name = "ai-casino"
version = "0.1.0"
description = "Agentic stock trading system with multi-agent architecture"
readme = "README.md"
requires-python = "==3.14.3"
dependencies = [
    # Technical Analysis
    "pandas==3.0.0",
    "pandas-ta-classic==0.3.59",
    "numpy==2.4.2",
    # Sentiment Analysis
    "transformers==5.1.0",
    "torch==2.10.0",
    # LLM & Agents
    "openai==2.20.0",
    "anthropic==0.79.0",
    "httpx==0.28.1",
    "langgraph==1.0.8",
    "langchain-core==1.2.12",
    # Market Data
    "yfinance==1.1.0",
    "alpha-vantage==3.0.0",
    # Trading
    "alpaca-py==0.43.2",
    "backtesting==0.6.5",
    "bokeh>=3.8,<3.9",  # backtesting 0.6.5 incompatible with bokeh 3.8+
    # Optimization
    "optuna==4.7.0",
    "riskfolio-lib==6.3.1",
    "quantstats==0.0.81",
    # Database
    "sqlalchemy[asyncio]==2.0.46",
    "asyncpg==0.31.0",
    # Web Search
    "ddgs==9.10.0",
    "diskcache==5.6.3",
    # Reddit
    "praw==7.8.1",
    # Utilities
    "tenacity==9.1.4",
    "python-dotenv==1.2.1",
    "python-dateutil==2.9.0.post0",
    "rich==14.3.2",
    "loguru==0.7.3",
    "pydantic==2.12.5",
    "pydantic-settings==2.12.0",
    "pyyaml==6.0.3",
    "packaging>=24.0",  # Required by langsmith (transitive dependency)
    # API Server
    "fastapi==0.129.0",
    "uvicorn[standard]==0.40.0",
    # CLI & TUI
    "typer==0.23.0",
    "textual==7.5.0",
    "dependency-injector==4.48.3",  # DI container infrastructure
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.0.0",
    "pytest-mock==3.15.1",
    "ruff==0.15.0",
    "aiosqlite==0.22.1",
]
profiling = [
    "yappi>=1.6.0",
    "snakeviz>=2.2.0",
]

[project.scripts]
aicasino = "src.cli.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.pyrefly]
# Pyrefly uses strict type checking by default
# Configuration is minimal - strictness comes from complete type annotations + ANN rules
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
project-excludes = [
    "tests/**",
    "services/**",
]

[tool.uv]
# Restrict dependency resolution to Unix platforms (Linux/macOS)
# Prevents Windows resolution failures in CI for platform-specific deps like riskfolio-lib
environments = ["sys_platform == 'linux' or sys_platform == 'darwin'"]

[dependency-groups]
dev = [
    "pip-audit>=2.10.0",
    "pyrefly==0.52.0",
    "ruff>=0.15.0",
]
