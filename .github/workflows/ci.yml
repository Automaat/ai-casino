---
name: CI

"on":
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install mise
        uses: jdx/mise-action@6d1e696aa24c1aa1bcc1adea0212707c71ab78a8  # v3.6.1

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Activate venv
        run: echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV" && echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Check formatting
        run: mise run format:check

      - name: Lint
        run: mise run lint

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install mise
        uses: jdx/mise-action@6d1e696aa24c1aa1bcc1adea0212707c71ab78a8  # v3.6.1

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Activate venv
        run: echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV" && echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Run tests
        run: mise run test

  yamllint:
    name: Lint YAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Run yamllint
        uses: ibiqlik/action-yamllint@2576378a8e339169678f9939646ee3ee325e845c  # v3.1.1
        with:
          config_data: |
            extends: default
            rules:
              line-length:
                max: 120
              comments:
                min-spaces-from-content: 1
              document-start: disable
              truthy:
                check-keys: false

  actionlint:
    name: Lint GitHub Actions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Run actionlint
        uses: devops-actions/actionlint@467e2ce19b2310e93c9ffa0b50fe31f86b5a7f23  # v0.1.10

  uv-lock-check:
    name: Check uv.lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install mise
        uses: jdx/mise-action@6d1e696aa24c1aa1bcc1adea0212707c71ab78a8  # v3.6.1

      - name: Check uv.lock is up-to-date
        run: uv lock --check

  security-audit:
    name: Security Audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install mise
        uses: jdx/mise-action@6d1e696aa24c1aa1bcc1adea0212707c71ab78a8  # v3.6.1

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Run pip-audit
        run: uv run pip-audit
